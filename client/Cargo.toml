[package]
name = "pqanon-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PQ-ANON — from-scratch post-quantum anonymizing VPN client (PQANON/1)"

[lib]
name = "pqanon"
path = "src/lib.rs"

[[bin]]
name = "pqanon"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
ml-kem             = "0.2"
ml-dsa             = "0.0.4"
x25519-dalek       = { version = "2", features = ["static_secrets"] }
ed25519-dalek      = { version = "2", features = ["rand_core"] }
chacha20poly1305   = "0.10"
hkdf               = "0.12"
sha2               = "0.10"
hmac               = "0.12"
argon2             = "0.5"
rand               = "0.8"
rand_core          = "0.6"
zeroize            = { version = "1", features = ["derive"] }
serde              = { version = "1", features = ["derive"] }
toml               = "0.8"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4", features = ["derive"] }
hex                = "0.4"
