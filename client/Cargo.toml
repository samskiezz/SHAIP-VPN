[package]
name = "shaip-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SHAIP VPN — from-scratch post-quantum anonymizing VPN client (SHAIP/1)"

[lib]
name = "shaip"
path = "src/lib.rs"

[[bin]]
name = "shaip"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
ml-kem             = "0.2"
ml-dsa             = "0.0.4"
x25519-dalek       = { version = "2", features = ["static_secrets"] }
ed25519-dalek      = { version = "2", features = ["rand_core"] }
chacha20poly1305   = "0.10"
chacha20           = "0.9"
hkdf               = "0.12"
sha2               = "0.10"
hmac               = "0.12"
argon2             = "0.5"
rand               = "0.8"
rand_core          = "0.6"
zeroize            = { version = "1", features = ["derive"] }
serde              = { version = "1", features = ["derive"] }
toml               = "0.8"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4", features = ["derive"] }
hex                = "0.4"
serde_json         = "1"
ipnet              = "2"
blind-rsa-signatures = "0.18.0"
base64 = "0.23.1"
rsa                = { version = "0.9", features = ["sha2"] }
p256               = { version = "0.13", features = ["ecdsa"] }
ureq               = { version = "2", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
# Traffic-analysis defence (SHAIP-SHAPE/1): the real Maybenot framework runs the
# padding/blocking state machines that shape the client's send timing. Maybenot
# is built on rand 0.9, so it is brought in under an alias alongside the rest of
# the crate's rand 0.8; enum-map matches Maybenot's version so machine States can
# be built programmatically against its Event enum.
maybenot = "2.2.2"
rand09 = { package = "rand", version = "0.9" }
enum-map = "2.7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
