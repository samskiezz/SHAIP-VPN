# XcodeGen spec. On a Mac with Xcode 26 and rustup:
#   brew install xcodegen
#   ./scripts/build-ffi.sh          # the Rust core → Frameworks/ShaipFFI.xcframework
#   xcodegen generate && open SHAIP.xcodeproj
#
# Targets:
#   SHAIP         the app (SwiftUI, iOS 26, Liquid Glass)
#   SHAIPTunnel   the Packet Tunnel extension: the VPN itself, running the Rust core (shaip-ffi)
#   SHAIPWidgets  the Live Activity + Dynamic Island extension (ActivityKit / WidgetKit)
# All link the local SHAIPCore package (config parsing, status model, rates, the Protection report,
# render engines), which also builds and tests on its own: swift test --package-path SHAIPCore
#
# Running on a device needs a development team with the Network Extensions capability
# (packet-tunnel-provider) and an App Group; set DEVELOPMENT_TEAM below.
name: SHAIP
options:
  bundleIdPrefix: com.shaip
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SHAIPCore:
    path: SHAIPCore
settings:
  base:
    # Language mode: "5.0" or "6.0" are the valid values.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                  # set your team to run on a device
    ENABLE_PREVIEWS: "YES"
targets:
  SHAIP:
    type: application
    platform: iOS
    sources:
      - path: SHAIP
      - path: Shared
      - path: FFI
    dependencies:
      - package: SHAIPCore
      - framework: Frameworks/ShaipFFI.xcframework
        embed: false                      # a static library
      - target: SHAIPTunnel
      - target: SHAIPWidgets
      - sdk: NetworkExtension.framework
    entitlements:
      path: SHAIP/SHAIP.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.shaip.vpn]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaip.vpn
        # Generated Info.plist merged with SHAIP/Info.plist for keys that have no build setting.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: SHAIP/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SHAIP
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  SHAIPTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: SHAIPTunnel
      - path: FFI
      - path: Shared/AppGroup.swift
    dependencies:
      - package: SHAIPCore
      - framework: Frameworks/ShaipFFI.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    entitlements:
      path: SHAIPTunnel/SHAIPTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.shaip.vpn]
    preBuildScripts:
      # Rebuilds the Rust core when its sources changed (cargo is incremental).
      - name: Build Rust core (shaip-ffi)
        script: '"$PROJECT_DIR/scripts/build-ffi.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaip.vpn.tunnel
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: SHAIPTunnel/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SHAIP Tunnel
        SKIP_INSTALL: "YES"
        # The script writes into the source tree.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  SHAIPWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SHAIPWidgets
      - path: Shared
    dependencies:
      - package: SHAIPCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaip.vpn.widgets
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: SHAIPWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SHAIP
        SKIP_INSTALL: "YES"
