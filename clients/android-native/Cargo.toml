[package]
name = "shaip-android-jni"
version = "0.1.0"
edition = "2021"
description = "JNI bridge from the Android app to the shaip post-quantum core"

[lib]
name = "shaip_jni"
crate-type = ["cdylib"]

[dependencies]
shaip = { path = "../../client", package = "shaip-client" }
jni = "0.21"
hex = "0.4"

[profile.release]
strip = true
opt-level = "z"

# Isolate from the parent workspace.
[workspace]
