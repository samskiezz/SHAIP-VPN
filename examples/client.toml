# PQ-ANON client config (§12.2). Copy to ~/.pqanon/client.toml.
[client]
# Persistent identity (ML-DSA-65 + Ed25519), created 0600 by
# `pqanon keygen --out ~/.pqanon/client.id`. Omit for a throwaway per-run identity.
identity    = "/home/user/.pqanon/client.id"
tun_device  = "pqanon-c0"
tun_address = "10.77.0.2/24"

[server]
address           = "vpn.example.com:443"
# Pins: paste the output of `pqanond --identity <file> --print-public`.
server_ml_dsa_pub = "hex..."
server_ed_pub     = "hex..."

[transport]
mtu_probe   = true
stream_mode = true
congestion  = "bbr-custom"

[route]
default      = "fast"
anon_domains = ["*.journalist.org", "*.leak.net"]
fast_domains = ["*.cdn.example.com"]

[mix]
enabled     = true
path_length = 5
cover_rate  = 1.0
