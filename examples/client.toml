# SHAIP VPN client config. Copy to ~/.shaip/client.toml and run:
#   sudo shaip run --config ~/.shaip/client.toml        (add --kill-switch to fail closed)
# The iOS app imports this same file (Setup → Import config file).
#
# Only the keys below are read. Routing, DNS, MTU and keepalive come from the
# server when the session starts.

[client]
# Persistent identity (ML-DSA-65 + Ed25519), created 0600 on first use (or by
# `shaip keygen --out …`). Omit for a throwaway per-run identity, which only
# open demo servers accept.
identity    = "/home/user/.shaip/client.id"
# Device certificate from `shaip enroll`, needed by servers that admit
# enrolled devices only.
device_cert = "/home/user/.shaip/client.id.cert"
tun_device  = "shaip-c0"
# Used only if the server assigns no address (an echo-mode test server).
tun_address = "10.77.0.2/24"

# Traffic-analysis defence (SHAIP-SHAPE/1). Even though every datagram is
# encrypted and length-shaped, the *timing* of your upstream packets still forms
# a recognizable pattern. This runs the Maybenot framework to inject padding
# (cover) packets — and, on "medium", to briefly hold real packets — so that
# pattern is hidden. It defends upstream (client→server) traffic only; it adds
# cover traffic and, on "medium", a little latency.
#   off     — none (default): packets leave exactly when you send them.
#   light   — low-overhead gap-filling padding (≤ ~50% padding), no blocking.
#   medium  — more padding plus occasional brief blocking (a few ms of latency).
traffic_shaping = "off"
# Advanced: supply your own tuned, serialized Maybenot machines instead of a
# preset (overrides traffic_shaping when non-empty), with explicit overhead caps.
# shaping_machines = ["02eNp..."]
# max_padding_frac  = 0.5   # cap on padding as a fraction of total packets
# max_blocking_frac = 0.0   # cap on blocking time as a fraction of elapsed time

[server]
address           = "vpn.example.com:443"
# Pins: paste the output of `shaipd --identity <file> --print-public` on the
# server. The client refuses any server that can't prove it holds these keys.
server_ml_dsa_pub = "hex..."
server_ed_pub     = "hex..."

# Optional, for the iOS app's device enrollment (the CLI uses `shaip enroll`).
# [enroll]
# control_plane = "https://cp.example.com"
# authority_key = "hex..."   # the control plane's enroll_authority_pub
# ca_key        = "hex..."   # the control plane's device_ca_pub
