services:
  db:
    image: postgres:16
    # The database logs no statements and no error details: a constraint
    # error's DETAIL line would quote the value (an account number, a device
    # key) in the database log.
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic",
              "-c", "log_statement=none", "-c", "log_connections=off", "-c", "log_disconnections=off"]
    environment:
      POSTGRES_USER: shaip
      POSTGRES_PASSWORD: shaip
      POSTGRES_DB: shaip
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaip"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build: ./control-plane
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://shaip:shaip@db:5432/shaip
      LISTEN_ADDR: ":8080"
      # Metrics on their own port, reachable inside the compose network only
      # (not published): public counters would show when someone pays.
      METRICS_ADDR: ":9102"
    depends_on:
      db:
        condition: service_healthy

  web-ui:
    build: ./web-ui
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on: [control-plane]

  # The VPN server: a TUN device, NAT out of the container's eth0, the DNS
  # forwarder on the tunnel address, and a persistent identity that clients pin.
  # Print the pins for clients' [server] table with:
  #   docker compose run --rm shaipd --identity /var/lib/shaip/shaipd.id --print-public
  shaipd:
    build:
      context: .
      dockerfile: server/Dockerfile
    user: root                  # TUN and nftables need CAP_NET_ADMIN
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - shaipd-data:/var/lib/shaip
    command: ["--identity", "/var/lib/shaip/shaipd.id", "--listen", "0.0.0.0:443",
              "--tun", "shaip0", "--nat", "eth0", "--metrics", "0.0.0.0:9100"]
    ports:
      - "443:443/udp"

  shaip-mixd:
    build:
      context: .
      dockerfile: server/Dockerfile
    entrypoint: ["/usr/local/bin/shaip-mixd"]
    command: ["--listen", "0.0.0.0:8443", "--metrics", "0.0.0.0:9101"]
    ports:
      - "8443:8443/udp"

  # --- Monitoring (§16). `docker compose up` brings up a working stack:
  #     Grafana  → http://localhost:3001   Prometheus → http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports: ["9090:9090"]
    depends_on: [control-plane]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_SERVICE_KEY: ${PAGERDUTY_SERVICE_KEY:-}
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PW:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3001:3000"]
    depends_on: [prometheus]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports: ["9115:9115"]

  node-exporter:
    image: prom/node-exporter:v1.9.0
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    pid: host

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://shaip:shaip@db:5432/shaip?sslmode=disable
    depends_on: [db]

volumes:
  shaipd-data:
  pgdata:
  prometheus-data:
  grafana-data:
