services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pqanon
      POSTGRES_PASSWORD: pqanon
      POSTGRES_DB: pqanon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqanon"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build: ./control-plane
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://pqanon:pqanon@db:5432/pqanon
      LISTEN_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy

  web-ui:
    build: ./web-ui
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on: [control-plane]

  pqanond:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["--listen", "0.0.0.0:443"]
    ports:
      - "443:443/udp"

  pqanon-mixd:
    build:
      context: .
      dockerfile: server/Dockerfile
    entrypoint: ["/usr/local/bin/pqanon-mixd"]
    command: ["--listen", "0.0.0.0:8443"]
    ports:
      - "8443:8443/udp"

volumes:
  pgdata:
