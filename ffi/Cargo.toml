[package]
name = "shaip-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C ABI over shaip::client for native SHAIP VPN front ends (include/shaip.h)"

[lib]
name = "shaip_ffi"
# staticlib for iOS/macOS shells, cdylib for Android (JNI) and Windows, rlib for Rust tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
shaip = { path = "../client", package = "shaip-client" }
tokio  = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
hex    = "0.4"
