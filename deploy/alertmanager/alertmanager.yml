# Alertmanager routing (§16). Pages go to PagerDuty + a Slack incidents channel;
# warnings go to a Slack warnings channel. Secrets come from the environment
# (set SLACK_WEBHOOK_URL / PAGERDUTY_SERVICE_KEY in docker-compose).
global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [ 'severity = page' ]
      receiver: 'pager'
      continue: true
    - matchers: [ 'severity = page' ]
      receiver: 'slack-incidents'
    - matchers: [ 'severity = warn' ]
      receiver: 'slack-warnings'

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#shaip-alerts'
        send_resolved: true

  - name: 'slack-incidents'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#shaip-incidents'
        title: '🚨 {{ .GroupLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        send_resolved: true

  - name: 'slack-warnings'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#shaip-warnings'
        send_resolved: true

  - name: 'pager'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical

inhibit_rules:
  - source_matchers: [ 'severity = page' ]
    target_matchers: [ 'severity = warn' ]
    equal: ['alertname', 'cluster']
