# PQ-ANON Prometheus config (§16). Scrapes the real /metrics endpoints the
# control plane and daemons expose; the rules in rules/ reference only series
# these targets actually emit.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: pqanon

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'control-plane'
    metrics_path: /metrics
    static_configs:
      - targets: ['control-plane:9102']   # METRICS_ADDR, never the public API port
        labels: { role: 'control-plane' }

  - job_name: 'pqanond'
    metrics_path: /metrics
    static_configs:
      - targets: ['pqanond:9100']
        labels: { role: 'tunnel' }

  - job_name: 'pqanon-mixd'
    metrics_path: /metrics
    static_configs:
      - targets: ['pqanon-mixd:9101']
        labels: { role: 'mix' }

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Black-box probe of the tunnel UDP port (liveness of the listener).
  - job_name: 'blackbox-udp'
    metrics_path: /probe
    params:
      module: [udp_connect]
    static_configs:
      - targets: ['pqanond:443']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
