[package]
name = "shaip-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SHAIP VPN server daemons: shaipd (tunnel) and shaip-mixd (mix node)"

[[bin]]
name = "shaipd"
path = "src/bin/shaipd.rs"

[[bin]]
name = "shaip-mixd"
path = "src/bin/shaip-mixd.rs"

[[bin]]
name = "shaip-decoy"
path = "src/bin/shaip-decoy.rs"

[dependencies]
shaip             = { path = "../client", package = "shaip-client" }
tokio              = { version = "1", features = ["full"] }
x25519-dalek       = { version = "2", features = ["static_secrets"] }
ed25519-dalek      = "2"
rand               = "0.8"
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# For the SHAIP-PT/1 bridge end-to-end test (TLS carrier + self-signed cert).
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen        = { version = "0.13", default-features = false, features = ["ring", "pem"] }
